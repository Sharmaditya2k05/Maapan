# Cloud Build: build → push to Artifact Registry → deploy to Cloud Run.
# Trigger: push to `main` (deploys to dev) and tags `v*` (deploy to staging/prod via _ENV).
#
# One-time setup is in sanchalan/scripts/gcp-bootstrap.sh. Substitutions you may override
# on the trigger: _ENV, _REGION, _MOOL_REF.
substitutions:
  _SERVICE: buddhi
  _ENV: dev
  _REGION: asia-south1
  _REPO: maapan
  _MOOL_REPO: github.com/maapan/mool
  _MOOL_REF: main
  _VPC_NETWORK: maapan-vpc
  _VPC_SUBNET: maapan-run-subnet

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN

steps:
  - id: test
    name: golang:1.25
    entrypoint: bash
    secretEnv: [GITHUB_TOKEN]
    args:
      - -c
      - |
        git clone --depth 1 --branch ${_MOOL_REF} https://x-access-token:$$GITHUB_TOKEN@${_MOOL_REPO}.git ../mool
        cp -r ../mool .mool
        go vet ./... && go test ./...

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --build-context
      - mool=.mool
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --push
      - .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com
      - --ingress=internal
      - --no-allow-unauthenticated
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --cpu=1
      - --memory=1Gi                # bill photos/PDFs up to 10 MB are held in memory
      - --concurrency=40
      - --timeout=300               # ask-your-books streams; agent loop may take a while
      - --min-instances=0           # not on the billing path; cold starts are fine
      - --max-instances=10          # also caps concurrent Claude spend
      - --update-env-vars=APP_ENV=${_ENV},EVENTS_DRIVER=pubsub,GCP_PROJECT=$PROJECT_ID,EVENTS_TRUST_IAM=true,USE_ID_TOKENS=true,AUTO_MIGRATE=true,CORS_ORIGINS=https://app.maapan.in,AI_MODEL_SMART=claude-opus-5-5,AI_MODEL_FAST=claude-opus-5-5,AI_MONTHLY_TOKEN_BUDGET=2000000,AI_REQUIRE_TENANT_FLAG=true,BAHI_URL=https://bahi-$PROJECT_NUMBER.${_REGION}.run.app,BHANDAR_URL=https://bhandar-$PROJECT_NUMBER.${_REGION}.run.app,AADESH_URL=https://aadesh-$PROJECT_NUMBER.${_REGION}.run.app,SOOCHNA_URL=https://soochna-$PROJECT_NUMBER.${_REGION}.run.app,PEHCHAAN_URL=https://pehchaan-$PROJECT_NUMBER.${_REGION}.run.app
      - --update-secrets=DATABASE_URL=buddhi-database-url:latest,REDIS_URL=redis-url:latest,JWT_SECRET=jwt-secret:latest,SERVICE_SECRET=service-secret:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
