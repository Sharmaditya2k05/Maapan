# Cloud Build: test → build → push to Artifact Registry → deploy dwaar to Cloud Run.
# dwaar is the ONLY public backend: ingress "all", unauthenticated at the IAM layer
# (it verifies user JWTs itself). Put it behind the global HTTPS load balancer +
# Cloud Armor (api.maapan.in) — see sanchalan/scripts.
substitutions:
  _SERVICE: dwaar
  _ENV: dev
  _REGION: asia-south1
  _REPO: maapan
  _MOOL_REPO: github.com/maapan/mool
  _MOOL_REF: main
  _VPC_NETWORK: maapan-vpc
  _VPC_SUBNET: maapan-run-subnet
  _CORS_ORIGINS: https://app.maapan.in
  # "all" until the HTTPS load balancer exists; then "internal-and-cloud-load-balancing"
  # so Cloud Armor cannot be bypassed via the run.app URL.
  _INGRESS: all

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN

steps:
  - id: test
    name: golang:1.25
    entrypoint: bash
    secretEnv: [GITHUB_TOKEN]
    args:
      - -c
      - |
        git clone --depth 1 --branch ${_MOOL_REF} https://x-access-token:$$GITHUB_TOKEN@${_MOOL_REPO}.git ../mool
        cp -r ../mool .mool
        go vet ./... && go test ./...

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --build-context
      - mool=.mool
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --push
      - .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com
      - --ingress=${_INGRESS}
      - --allow-unauthenticated
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=all-traffic   # upstreams have internal ingress; reach them through the VPC
      - --cpu=1
      - --memory=256Mi
      - --concurrency=250
      - --min-instances=1
      - --max-instances=30
      - --timeout=300
      - --update-env-vars=APP_ENV=${_ENV},USE_ID_TOKENS=true,CORS_ORIGINS=${_CORS_ORIGINS},RATE_LIMIT_PUBLIC_PER_MIN=20,RATE_LIMIT_USER_PER_MIN=600,MAX_BODY_MB=25,UPSTREAM_TIMEOUT=60s,PEHCHAAN_URL=https://pehchaan-$PROJECT_NUMBER.${_REGION}.run.app,BAHI_URL=https://bahi-$PROJECT_NUMBER.${_REGION}.run.app,KAR_URL=https://kar-$PROJECT_NUMBER.${_REGION}.run.app,AADESH_URL=https://aadesh-$PROJECT_NUMBER.${_REGION}.run.app,LENDEN_URL=https://lenden-$PROJECT_NUMBER.${_REGION}.run.app,SOOCHNA_URL=https://soochna-$PROJECT_NUMBER.${_REGION}.run.app,AAYAAT_URL=https://aayaat-$PROJECT_NUMBER.${_REGION}.run.app,BHANDAR_URL=https://bhandar-$PROJECT_NUMBER.${_REGION}.run.app,NIRMAAN_URL=https://nirmaan-$PROJECT_NUMBER.${_REGION}.run.app,BUDDHI_URL=https://buddhi-$PROJECT_NUMBER.${_REGION}.run.app
      - --update-secrets=JWT_SECRET=jwt-secret:latest,SERVICE_SECRET=service-secret:latest,REDIS_URL=redis-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
