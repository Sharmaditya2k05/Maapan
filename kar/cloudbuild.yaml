# Cloud Build: build → push to Artifact Registry → deploy to Cloud Run.
# Trigger: push to `main` (deploys to dev) and tags `v*` (deploy to staging/prod via _ENV).
#
# One-time setup is in sanchalan/scripts/gcp-bootstrap.sh. Substitutions you may override
# on the trigger: _ENV, _REGION, _MOOL_REF.
substitutions:
  _SERVICE: kar
  _ENV: dev
  _REGION: asia-south1
  _REPO: taraju
  _MOOL_REPO: github.com/taraju/mool
  _MOOL_REF: main
  _VPC_NETWORK: taraju-vpc
  _VPC_SUBNET: taraju-run-subnet
  _GSP_BASE_URL: https://api.your-gsp.example   # set on the trigger once the GSP contract is signed

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN

steps:
  - id: test
    name: golang:1.25
    entrypoint: bash
    secretEnv: [GITHUB_TOKEN]
    args:
      - -c
      - |
        git clone --depth 1 --branch ${_MOOL_REF} https://x-access-token:$$GITHUB_TOKEN@${_MOOL_REPO}.git ../mool
        cp -r ../mool .mool
        go vet ./... && go test ./...

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --build-context
      - mool=.mool
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --push
      - .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com
      - --ingress=internal
      - --no-allow-unauthenticated
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=0           # not on the billing hot path (aadesh runs GST maths in-process)
      - --max-instances=5
      - --update-env-vars=APP_ENV=${_ENV},EVENTS_DRIVER=pubsub,GCP_PROJECT=$PROJECT_ID,EVENTS_TRUST_IAM=true,USE_ID_TOKENS=true,AUTO_MIGRATE=true,CORS_ORIGINS=https://app.taraju.in,AADESH_URL=https://aadesh-$PROJECT_NUMBER.${_REGION}.run.app,PEHCHAAN_URL=https://pehchaan-$PROJECT_NUMBER.${_REGION}.run.app,BAHI_URL=https://bahi-$PROJECT_NUMBER.${_REGION}.run.app,GSTIN_PROVIDER=gsp,GSP_BASE_URL=${_GSP_BASE_URL}
      - --update-secrets=DATABASE_URL=kar-database-url:latest,JWT_SECRET=jwt-secret:latest,SERVICE_SECRET=service-secret:latest,GSP_CLIENT_ID=gsp-client-id:latest,GSP_CLIENT_SECRET=gsp-client-secret:latest,REDIS_URL=redis-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
